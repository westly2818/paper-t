services:
  - type: web
    name: paper-trader
    env: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: MODE
        value: live
      - key: CAPITAL
        value: 20000
      - key: RISK_PCT
        value: 1
      - key: LEVERAGE
        value: 1
      # Free Upstash Redis keeps trades across restarts. Paste the values in the Render dashboard.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
